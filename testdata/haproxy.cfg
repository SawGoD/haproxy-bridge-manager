# Lossless parser fixture: comments and unknown directives are intentional.
global
	daemon
	unknown-global-directive preserved

defaults
	mode tcp
	timeout connect 5s
	timeout client 1m
	timeout server 1m

frontend de1_in
	bind 127.0.0.1:10443
	option tcplog
	default_backend de1_out

backend de1_out
	unknown-backend-directive keep-me
	server de1-public 212.113.112.170:443 check maxconn 32
	server de1-netbird 100.100.212.113:443 check maxconn 32

frontend usa1_in
	bind 127.0.0.1:10444
	default_backend usa1_out

backend usa1_out
	server usa1-public 193.17.180.114:443 check
	server usa1-netbird 100.100.193.17:443 check

frontend lv1_in
	bind 127.0.0.1:10445
	default_backend lv1_out

backend lv1_out
	# lv1 is retained by targeted mutations.
	server lv1-public 37.128.206.186:443 check
	server lv1-netbird 100.100.37.129:443 check

frontend se1_in
	bind 127.0.0.1:10446
	default_backend se1_out

backend se1_out
	server se1-public 62.182.192.249:443 check
	server se1-netbird 100.100.62.182:443 check
